12" font-weight="700" fill="#181818" text-anchor="start">KPI fields</text><text x="72.0" y="385.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Net Sales = SUM(quantity * unit_price * (1-discount))</text><text x="72.0" y="399.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Gross Sales = SUM(quantity * unit_price)</text><text x="72.0" y="413.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Margin = Net Sales - SUM(quantity * unit_cost)</text><text x="72.0" y="427.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">descriptions on every KPI field</text></g></g><g class="edge"><title>next layer</title><path d="M 210.0 461.0 C 210.0 468.0 210.0 475.0 210.0 482.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>Read the same field</title><rect x="16" y="485" width="388" height="267" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="507" r="11" fill="#032d60"/><text x="38.0" y="511.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="56.0" y="512.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Read the same field</text><g class="cluster"><title>Workbooks</title><rect x="28" y="537" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="549.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="559.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Workbooks</text><text x="72.0" y="574.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">connect, never redefine</text></g><g class="cluster"><title>Tableau Pulse metric definition</title><rect x="28" y="598" width="364" height="79" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="624.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="620.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Pulse metric definition</text><text x="72.0" y="635.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">measure: Net Sales</text><text x="72.0" y="649.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">time: Order Date</text><text x="72.0" y="663.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">value going up: favourable</text></g><g class="cluster"><title>Ad hoc web authoring</title><rect x="28" y="687" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="699.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="709.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Ad hoc web authoring</text><text x="72.0" y="724.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">same fields, no local copies</text></g></g></svg>