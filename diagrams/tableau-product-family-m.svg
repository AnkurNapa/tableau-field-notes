xml;base64,"/><text x="72.0" y="384.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Server</text><text x="72.0" y="399.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">you install and run it</text></g><g class="cluster"><title>Tableau Cloud</title><rect x="28" y="423" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="435.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="445.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Cloud</text><text x="72.0" y="460.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Salesforce hosts it</text></g><g class="cluster"><title>Tableau Public</title><rect x="28" y="484" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="496.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="506.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Public</text><text x="72.0" y="521.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">free website: everything published is public</text></g></g><g class="edge"><title>next layer</title><path d="M 210.0 555.0 C 210.0 562.0 210.0 569.0 210.0 576.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>Watch</title><rect x="16" y="579" width="388" height="178" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="601" r="11" fill="#032d60"/><text x="38.0" y="605.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="56.0" y="606.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Watch</text><g class="cluster"><title>Tableau Pulse</title><rect x="28" y="631" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="643.5" width="26" height="