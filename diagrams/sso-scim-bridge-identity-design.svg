<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="473" viewBox="0 0 1200 473" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="How do sign-in, provisioning and Bridge meet at one Tableau Cloud site?"><title>How do sign-in, provisioning and Bridge meet at one Tableau Cloud site?</title><defs><marker id="ah-0176d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0176d3"/></marker><marker id="ah-032d60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#032d60"/></marker><marker id="ah-444b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444b53"/></marker><marker id="ah-59a14f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59a14f"/></marker><marker id="ah-8a939c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a939c"/></marker><marker id="ah-e15759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="472" rx="12" fill="#ffffff" stroke="#dddbda"/><text x="32.0" y="46.0" font-size="22" font-weight="800" fill="#181818" text-anchor="start">How do sign-in, provisioning and Bridge meet at one Tableau Cloud site?</text><text x="32.0" y="70.0" font-size="12" font-weight="400" fill="#444b53" text-anchor="start">The identity provider signs people in and pushes groups. Bridge clients in the plant network connect out over HTTPS</text><g class="cluster"><title>Identity provider</title><rect x="24" y="112" width="300" height="269" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="46" cy="134" r="11" fill="#032d60"/><text x="46.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="64.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Identity provider</text><g class="cluster"><title>Single sign-on</title><rect x="36" y="164" width="276" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="176.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="186.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Single sign-on</text><text x="80.0" y="201.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">SAML or OIDC plus MFA</text></g><g class="cluster"><title>SCIM</title><rect x="36" y="239" width="276" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="251.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="261.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">SCIM</text><text x="80.0" y="276.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">pushes users and groups</text></g><g class="cluster"><title>User attributes</title><rect x="36" y="314" width="276" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="326.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="336.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">User attributes</text><text x="80.0" y="351.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">region, cost centre</text></g></g><g class="cluster"><title>Tableau Cloud</title><rect x="340" y="112" width="300" height="269" rx="12" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><circle cx="362" cy="134" r="11" fill="#0176d3"/><text x="362.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="380.0" y="139.5" font-size="15" font-weight="700" fill="#0176d3" text-anchor="start">Tableau Cloud</text><g class="cluster"><title>Tableau Cloud site</title><rect x="352" y="164" width="276" height="201" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="362" y="251.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="396.0" y="247.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Cloud site</text><text x="396.0" y="262.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">groups from SCIM</text><text x="396.0" y="276.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">RLS: USERATTRIBUTE()</text><text x="396.0" y="290.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">or an entitlement table</text></g></g><g class="cluster"><title>Private network</title><rect x="656" y="112" width="520" height="269" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1.3" stroke-dasharray="6 5"/><circle cx="678" cy="134" r="11" fill="#032d60"/><text x="678.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="696.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Private network</text><g class="cluster"><title>Tableau Bridge pool &quot;Plant&quot;</title><rect x="668" y="164" width="496" height="126" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="678" y="214.0" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="712.0" y="216.5" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Bridge pool &quot;Plant&quot;</text><text x="712.0" y="231.5" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">two Bridge clients, each a VM running as a service</text><text x="712.0" y="245.5" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">domain: plant.internal</text></g><g class="cluster"><title>ERP database</title><rect x="668.0" y="314" width="242.0" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="678.0" y="326.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="712.0" y="336.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">ERP database</text><text x="712.0" y="351.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">on premises</text></g><g class="cluster"><title>File share</title><rect x="922.0" y="314" width="242.0" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="932.0" y="326.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="966.0" y="336.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">File share</text><text x="966.0" y="351.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">on premises</text></g></g><g class="edge"><title>sign-in</title><path d="M 312.0 189.5 C 324.3 189.5 336.7 189.5 349.0 189.5" fill="none" stroke="#e15759" stroke-width="1.6" marker-end="url(#ah-e15759)"/></g><g class="edge"><title>provisioning</title><path d="M 312.0 264.5 C 324.3 264.5 336.7 264.5 349.0 264.5" fill="none" stroke="#e15759" stroke-width="1.6" marker-end="url(#ah-e15759)"/></g><g class="edge"><title>attributes for RLS</title><path d="M 312.0 339.5 C 324.3 339.5 336.7 339.5 349.0 339.5" fill="none" stroke="#e15759" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-e15759)"/></g><g class="edge"><title>outbound HTTPS</title><path d="M 668.0 227.0 C 655.7 227.0 643.3 227.0 631.0 227.0" fill="none" stroke="#59a14f" stroke-width="1.6" marker-end="url(#ah-59a14f)"/></g><g class="edge"><title>Bridge to ERP</title><path d="M 789.0 290.0 C 789.0 297.0 789.0 304.0 789.0 311.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>Bridge to file share</title><path d="M 1043.0 290.0 C 1043.0 297.0 1043.0 304.0 1043.0 311.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>legend</title><rect x="24" y="409" width="1152" height="44" rx="10" fill="#f6f7f8" stroke="#dddbda"/><path d="M 40 431.0 L 70 431.0" stroke="#e15759" stroke-width="1.8" marker-end="url(#ah-e15759)" fill="none"/><text x="78.0" y="435.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">sign-in and provisioning</text><path d="M 241.28 431.0 L 271.28 431.0" stroke="#e15759" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-e15759)" fill="none"/><text x="279.3" y="435.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">attributes for row-level security</text><path d="M 494.03999999999996 431.0 L 524.04 431.0" stroke="#59a14f" stroke-width="1.8" marker-end="url(#ah-59a14f)" fill="none"/><text x="532.0" y="435.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">Bridge connects out over HTTPS</text><path d="M 729.64 431.0 L 759.64 431.0" stroke="#0176d3" stroke-width="1.8" marker-end="url(#ah-0176d3)" fill="none"/><text x="767.6" y="435.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">query</text><rect x="822.24" y="423.0" width="22" height="16" rx="4" fill="none" stroke="#8a939c" stroke-width="1.3" stroke-dasharray="4 3"/><text x="852.2" y="435.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">private network</text></g></svg>