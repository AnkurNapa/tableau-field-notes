<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="631" viewBox="0 0 1200 631" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Where does the data policy hold, and where does it stop?"><title>Where does the data policy hold, and where does it stop?</title><defs><marker id="ah-0176d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0176d3"/></marker><marker id="ah-032d60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#032d60"/></marker><marker id="ah-444b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444b53"/></marker><marker id="ah-59a14f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59a14f"/></marker><marker id="ah-8a939c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a939c"/></marker><marker id="ah-e15759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="630" rx="12" fill="#ffffff" stroke="#dddbda"/><text x="32.0" y="46.0" font-size="22" font-weight="800" fill="#181818" text-anchor="start">Where does the data policy hold, and where does it stop?</text><text x="32.0" y="70.0" font-size="12" font-weight="400" fill="#444b53" text-anchor="start">The policy rides the virtual connection into the certified source; the Prep output escapes it, so it sits in a locked project</text><g class="cluster"><title>Warehouse</title><rect x="24" y="112" width="236" height="351" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="46" cy="134" r="11" fill="#032d60"/><text x="46.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="64.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Warehouse</text><g class="cluster"><title>Cloud warehouse</title><rect x="36" y="164" width="212" height="79" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="190.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="186.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Cloud warehouse</text><text x="80.0" y="201.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">orders, stores, products</text><text x="80.0" y="215.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">store_access entitlement</text><text x="80.0" y="229.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">table</text></g></g><g class="cluster"><title>Virtual connection</title><rect x="276" y="112" width="300" height="351" rx="12" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><circle cx="298" cy="134" r="11" fill="#0176d3"/><text x="298.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="316.0" y="139.5" font-size="15" font-weight="700" fill="#0176d3" text-anchor="start">Virtual connection</text><g class="cluster"><title>Harbour Warehouse</title><rect x="288" y="164" width="276" height="79" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="298" y="190.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="332.0" y="186.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Harbour Warehouse</text><text x="332.0" y="201.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">owner: data platform team</text><text x="332.0" y="215.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">embedded service account credentials</text><text x="332.0" y="229.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">extract refreshed 02:00</text></g><g class="cluster"><title>Data policy</title><rect x="288" y="273" width="276" height="79" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="298" y="299.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="332.0" y="295.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Data policy</text><text x="332.0" y="310.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">on orders and stores</text><text x="332.0" y="324.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">ISMEMBEROF(&quot;Harbour Finance&quot;)</text><text x="332.0" y="338.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">OR [username] = USERNAME()</text></g><g class="cluster"><title>store_access</title><rect x="288" y="382" width="276" height="65" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="298" y="401.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="332.0" y="411.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">store_access</text><text x="332.0" y="426.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">hidden, policy use only</text></g></g><g class="cluster"><title>Shape and publish</title><rect x="592" y="112" width="324" height="351" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="614" cy="134" r="11" fill="#032d60"/><text x="614.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="632.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Shape and publish</text><g class="cluster"><title>Harbour Sales</title><rect x="604" y="164" width="300" height="79" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="614" y="190.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="648.0" y="186.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Harbour Sales</text><text x="648.0" y="201.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">published data source, live</text><text x="648.0" y="215.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">certified, with a note</text><text x="648.0" y="229.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">policy still applies</text></g><g class="cluster"><title>Tableau Prep flow</title><rect x="604" y="273" width="300" height="79" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="614" y="299.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="648.0" y="295.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Prep flow</text><text x="648.0" y="310.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Harbour orders daily, analytics team</text><text x="648.0" y="324.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">cleans, joins, adds region_label</text><text x="648.0" y="338.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">scheduled with Prep Conductor</text></g><g class="cluster"><title>Harbour Orders</title><rect x="604" y="382" width="300" height="65" rx="8" fill="#ffffff" stroke="#e15759" stroke-width="1.5"/><image x="614" y="401.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="648.0" y="404.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Harbour Orders</text><text x="648.0" y="419.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">flow output, NOT filtered by the policy</text><text x="648.0" y="433.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">restricted to the Finance project</text></g></g><g class="cluster"><title>Consume</title><rect x="932" y="112" width="212" height="351" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="954" cy="134" r="11" fill="#032d60"/><text x="954.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="972.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Consume</text><g class="cluster"><title>Workbooks and dashboards</title><rect x="944" y="164" width="188" height="79" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="954" y="190.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="988.0" y="199.5" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Workbooks and</text><text x="988.0" y="214.5" font-size="12" font-weight="700" fill="#181818" text-anchor="start">dashboards</text></g></g><g class="edge"><title>tables</title><path d="M 248.0 203.5 C 260.3 203.5 272.7 203.5 285.0 203.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>live connection</title><path d="M 564.0 203.5 C 576.3 203.5 588.7 203.5 601.0 203.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>flow input</title><path d="M 564.0 203.5 C 575.3 203.5 586.7 203.5 598.0 203.5 C 598.0 239.8 598.0 276.2 598.0 312.5 C 599.0 312.5 600.0 312.5 601.0 312.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>unfiltered output</title><path d="M 754.0 352.0 C 754.0 361.0 754.0 370.0 754.0 379.0" fill="none" stroke="#e15759" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-e15759)"/></g><g class="edge"><title>filtered by the policy</title><path d="M 904.0 203.5 C 916.3 203.5 928.7 203.5 941.0 203.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>Tableau Catalog</title><rect x="24" y="487" width="1152" height="56" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="46" cy="509" r="11" fill="#032d60"/><text x="46.0" y="513.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="64.0" y="514.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Tableau Catalog</text><text x="208.0" y="513.0" font-size="11" font-weight="600" fill="#181818" text-anchor="start">lineage from warehouse column to dashboard, data quality warnings</text><text x="208.0" y="528.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">descriptions on tables and columns, sensitivity labels</text></g><g class="cluster"><title>legend</title><rect x="24" y="567" width="1152" height="44" rx="10" fill="#f6f7f8" stroke="#dddbda"/><path d="M 40 589.0 L 70 589.0" stroke="#0176d3" stroke-width="1.8" marker-end="url(#ah-0176d3)" fill="none"/><text x="78.0" y="593.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">data policy applies</text><path d="M 212.68 589.0 L 242.68 589.0" stroke="#e15759" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-e15759)" fill="none"/><text x="250.7" y="593.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">output the policy does not filter</text><rect x="465.44000000000005" y="581.0" width="22" height="16" rx="4" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><text x="495.4" y="593.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">where the policy lives</text></g></svg>