<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1271" viewBox="0 0 420 1271" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="What runs on each node of a three-node Tableau Server?"><title>What runs on each node of a three-node Tableau Server?</title><defs><marker id="ah-0176d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0176d3"/></marker><marker id="ah-032d60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#032d60"/></marker><marker id="ah-444b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444b53"/></marker><marker id="ah-59a14f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59a14f"/></marker><marker id="ah-8a939c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a939c"/></marker><marker id="ah-e15759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs><rect x="0.5" y="0.5" width="419" height="1270" rx="12" fill="#ffffff" stroke="#dddbda"/><text x="20.0" y="42.0" font-size="18" font-weight="800" fill="#181818" text-anchor="start">What runs on each node of a</text><text x="20.0" y="65.0" font-size="18" font-weight="800" fill="#181818" text-anchor="start">three-node Tableau Server?</text><g class="cluster"><title>Entry point</title><rect x="16" y="88" width="388" height="117" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="110" r="11" fill="#032d60"/><text x="38.0" y="114.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">LB</text><text x="56.0" y="115.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Entry point</text><g class="cluster"><title>External load balancer</title><rect x="28" y="140" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="152.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="162.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">External load balancer</text><text x="72.0" y="177.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">spreads user requests across every Gateway</text></g></g><g class="cluster"><title>Node 1 (initial)</title><rect x="16" y="235" width="388" height="342" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="257" r="11" fill="#032d60"/><text x="38.0" y="261.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="56.0" y="262.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Node 1 (initial)</text><g class="cluster"><title>Serves users</title><rect x="28" y="287" width="364" height="79" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="313.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="309.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Serves users</text><text x="72.0" y="324.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Gateway, Application Server</text><text x="72.0" y="338.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">VizQL Server, Data Server</text><text x="72.0" y="352.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Cache Server</text></g><g class="cluster"><title>Backgrounder</title><rect x="28" y="376" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="388.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="398.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Backgrounder</text><text x="72.0" y="413.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">node role: all-jobs</text></g><g class="cluster"><title>No File Store or Repository</title><rect x="28" y="437" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="449.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="459.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">No File Store or Repository</text><text x="72.0" y="474.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">the Repository moves off the initial node</text></g><g class="cluster"><title>Cluster services</title><rect x="28" y="498" width="364" height="65" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="517.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="520.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Cluster services</text><text x="72.0" y="535.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Coordination Service, Index and Search</text><text x="72.0" y="549.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Licensing and TSM</text></g></g><g class="cluster"><title>Node 2</title><rect x="16" y="607" width="388" height="314" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="629" r="11" fill="#032d60"/><text x="38.0" y="633.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="56.0" y="634.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Node 2</text><g class="cluster"><title>Serves users</title><rect x="28" y="659" width="364" height="65" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="678.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="681.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Serves users</text><text x="72.0" y="696.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Gateway, Application Server</text><text x="72.0" y="710.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">VizQL Server, Data Server</text></g><g class="cluster"><title>Backgrounder</title><rect x="28" y="734" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="746.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="756.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Backgrounder</text><text x="72.0" y="771.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">node role: flows</text></g><g class="cluster"><title>File Store</title><rect x="28" y="795" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="807.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="817.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">File Store</text><text x="72.0" y="832.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Repository, active</text></g><g class="cluster"><title>Cluster services</title><rect x="28" y="856" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="868.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="878.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Cluster services</text><text x="72.0" y="893.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Coordination Service, Index and Search</text></g></g><g class="cluster"><title>Node 3</title><rect x="16" y="951" width="388" height="300" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="973" r="11" fill="#032d60"/><text x="38.0" y="977.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="56.0" y="978.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Node 3</text><g class="cluster"><title>Serves users</title><rect x="28" y="1003" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="1015.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="1025.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Serves users</text><text x="72.0" y="1040.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Gateway, VizQL Server</text></g><g class="cluster"><title>Backgrounder</title><rect x="28" y="1064" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="1076.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="1086.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Backgrounder</text><text x="72.0" y="1101.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">node role: no-flows</text></g><g class="cluster"><title>File Store</title><rect x="28" y="1125" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="1137.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="1147.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">File Store</text><text x="72.0" y="1162.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Repository, passive copy for failover</text></g><g class="cluster"><title>Cluster services</title><rect x="28" y="1186" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="1198.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="1208.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Cluster services</text><text x=