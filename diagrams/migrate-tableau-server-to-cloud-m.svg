<svg xmlns="http://www.w3.org/2000/svg" width="420" height="866" viewBox="0 0 420 866" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="How does content move from Tableau Server to Tableau Cloud?"><title>How does content move from Tableau Server to Tableau Cloud?</title><defs><marker id="ah-0176d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0176d3"/></marker><marker id="ah-032d60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#032d60"/></marker><marker id="ah-444b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444b53"/></marker><marker id="ah-59a14f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59a14f"/></marker><marker id="ah-8a939c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a939c"/></marker><marker id="ah-e15759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs><rect x="0.5" y="0.5" width="419" height="865" rx="12" fill="#ffffff" stroke="#dddbda"/><text x="20.0" y="42.0" font-size="18" font-weight="800" fill="#181818" text-anchor="start">How does content move from</text><text x="20.0" y="65.0" font-size="18" font-weight="800" fill="#181818" text-anchor="start">Tableau Server to Tableau Cloud?</text><g class="cluster"><title>Source</title><rect x="16" y="88" width="388" height="178" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="110" r="11" fill="#032d60"/><text x="38.0" y="114.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="56.0" y="115.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Source</text><g class="cluster"><title>Tableau Server</title><rect x="28" y="140" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="152.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="162.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Server</text><text x="72.0" y="177.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">content after cleanup</text></g><g class="cluster"><title>Repository</title><rect x="28" y="201" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="213.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="223.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Repository</text><text x="72.0" y="238.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">inventory queries: owner, size, last view</text></g></g><g class="edge"><title>next layer</title><path d="M 210.0 272.0 C 210.0 279.0 210.0 286.0 210.0 293.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>Migrate</title><rect x="16" y="296" width="388" height="178" rx="12" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><circle cx="38" cy="318" r="11" fill="#0176d3"/><text x="38.0" y="322.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="56.0" y="323.5" font-size="15" font-weight="700" fill="#0176d3" text-anchor="start">Migrate</text><g class="cluster"><title>Tableau Migration SDK</title><rect x="28" y="348" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="360.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="370.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Migration SDK</text><text x="72.0" y="385.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">runs on a machine that can reach both REST APIs</text></g><g class="cluster"><title>Hooks</title><rect x="28" y="409" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="421.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="431.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Hooks</text><text x="72.0" y="446.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">map users, rename projects, filter content</text></g></g><g class="edge"><title>next layer</title><path d="M 210.0 480.0 C 210.0 487.0 210.0 494.0 210.0 501.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>Destination</title><rect x="16" y="504" width="388" height="239" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="526" r="11" fill="#032d60"/><text x="38.0" y="530.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="56.0" y="531.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Destination</text><g class="cluster"><title>Tableau Cloud site</title><rect x="28" y="556" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="568.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="578.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Cloud site</text><text x="72.0" y="593.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">SSO and SCIM</text></g><g class="cluster"><title>Groups and projects</title><rect x="28" y="617" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="629.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="639.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Groups and projects</text><text x="72.0" y="654.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">groups pre-created, projects locked</text></g><g class="cluster"><title>Tableau Bridge</title><rect x="28" y="678" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="690.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="700.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Bridge</text><text x="72.0" y="715.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">pools for on-premises sources</text></g></g><g class="cluster"><title>After cutover</title><rect x="16" y="773" width="388" height="73" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="795" r="11" fill="#032d60"/><text x="38.0" y="799.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="56.0" y="800.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">After cutover</text><text x="30.0" y="829.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Tableau Server goes read only, then off</text></g></svg>