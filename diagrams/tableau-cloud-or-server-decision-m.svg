0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">projects, groups, RLS</text><text x="72.0" y="413.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Admin Insights</text></g></g><g class="cluster"><title>Cloud data, direct</title><rect x="16" y="471" width="388" height="117" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="493" r="11" fill="#032d60"/><text x="38.0" y="497.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="56.0" y="498.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Cloud data, direct</text><g class="cluster"><title>Cloud warehouse</title><rect x="28" y="523" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="535.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="545.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Cloud warehouse</text><text x="72.0" y="560.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">direct connection, no Bridge</text></g></g><g class="cluster"><title>Your network, outbound only</title><rect x="16" y="618" width="388" height="239" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="640" r="11" fill="#032d60"/><text x="38.0" y="644.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="56.0" y="645.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Your network, outbound only</text><g class="cluster"><title>Tableau Bridge pool</title><rect x="28" y="670" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="682.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="692.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Bridge pool</text><text x="72.0" y="707.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">two or more VMs inside the network</text></g><g class="cluster"><title>ERP database</title><rect x="28" y="731" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="743.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="753.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">ERP database</text><text x="72.0" y="768.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">on premises</text></g><g class="cluster"><title>File share</title><rect x="28" y="792" width="364" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="804.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="814.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">File share</text><text x="72.0" y="829.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">on premises</text></g></g></svg>