<svg xmlns="http://www.w3.org/2000/svg" width="420" height="884" viewBox="0 0 420 884" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="In what order does Tableau apply filters and calculations?"><title>In what order does Tableau apply filters and calculations?</title><defs><marker id="ah-0176d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0176d3"/></marker></defs><rect x="0.5" y="0.5" width="419" height="883" rx="12" fill="#ffffff" stroke="#dddbda"/><text x="20.0" y="42.0" font-size="18" font-weight="800" fill="#181818" text-anchor="start">In what order does Tableau apply</text><text x="20.0" y="65.0" font-size="18" font-weight="800" fill="#181818" text-anchor="start">filters and calculations?</text><g class="cluster"><title>Data source</title><rect x="16" y="88" width="388" height="50" rx="8" fill="#f6f7f8" stroke="#dddbda" stroke-width="1"/><image x="28" y="100" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="64.0" y="110.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Data source</text><text x="64.0" y="125.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">where every query starts</text></g><g class="cluster"><title>Extract filters</title><rect x="16" y="154" width="388" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="41" cy="179" r="12" fill="#032d60"/><text x="41.0" y="183.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="64.0" y="176.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Extract filters</text><text x="64.0" y="191.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">applied when the extract is built</text></g><g class="cluster"><title>Data source filters</title><rect x="16" y="220" width="388" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="41" cy="245" r="12" fill="#032d60"/><text x="41.0" y="249.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="64.0" y="242.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Data source filters</text><text x="64.0" y="257.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">every sheet that uses the source</text></g><g class="cluster"><title>Context filters</title><rect x="16" y="286" width="388" height="50" rx="8" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><circle cx="41" cy="311" r="12" fill="#0176d3"/><text x="41.0" y="315.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="64.0" y="308.0" font-size="12" font-weight="700" fill="#0176d3" text-anchor="start">Context filters</text><text x="64.0" y="323.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">grey pills, right-click, Add to Context</text></g><g class="cluster"><title>Sets, conditional and Top N filters</title><rect x="16" y="352" width="388" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="41" cy="377" r="12" fill="#032d60"/><text x="41.0" y="381.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="64.0" y="374.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Sets, conditional and Top N filters</text><text x="64.0" y="389.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">with FIXED level of detail expressions</text></g><g class="cluster"><title>Dimension filters</title><rect x="16" y="418" width="388" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="41" cy="443" r="12" fill="#032d60"/><text x="41.0" y="447.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="64.0" y="440.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Dimension filters</text><text x="64.0" y="455.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">blue pills on Filters</text></g><g class="cluster"><title>Data blending</title><rect x="16" y="484" width="388" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="41" cy="509" r="12" fill="#032d60"/><text x="41.0" y="513.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="64.0" y="506.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Data blending</text><text x="64.0" y="521.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">with INCLUDE and EXCLUDE level of detail expressions</text></g><g class="cluster"><title>Measure filters</title><rect x="16" y="550" width="388" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="41" cy="575" r="12" fill="#032d60"/><text x="41.0" y="579.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">7</text><text x="64.0" y="572.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Measure filters</text><text x="64.0" y="587.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">green pills on Filters</text></g><g class="cluster"><title>Totals, forecasts, table calculations</title><rect x="16" y="616" width="388" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="41" cy="641" r="12" fill="#032d60"/><text x="41.0" y="645.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">8</text><text x="64.0" y="638.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Totals, forecasts, table calculations</text><text x="64.0" y="653.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">computed on what is left</text></g><g class="cluster"><title>Table calculation filters</title><rect x="16" y="682" width="388" height="50" rx="8" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><circle cx="41" cy="707" r="12" fill="#0176d3"/><text x="41.0" y="711.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">9</text><text x="64.0" y="704.0" font-size="12" font-weight="700" fill="#0176d3" text-anchor="start">Table calculation filters</text><text x="64.0" y="719.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">a filter on a table calc field</text></g><g class="cluster"><title>Trend lines and reference lines</title><rect x="16" y="748" width="388" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="41" cy="773" r="12" fill="#032d60"/><text x="41.0" y="777.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">10</text><text x="64.0" y="770.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Trend lines and reference lines</text><text x="64.0" y="785.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">drawn last</text></g><g class="cluster"><title>View</title><rect x="16" y="814" width="388" height="50" rx="8" fill="#f6f7f8" stroke="#dddbda" stroke-width="1"/><image x="28" y="826" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="64.0" y="836.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">View</text><text x="64.0" y="851.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">what the reader sees</text></g><g class="edge"><title>step 0 to 1</title><path d="M 210.0 138.0 C 210.0 142.3 210.0 146.7 210.0 151.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 1 to 2</title><path d="M 210.0 204.0 C 210.0 208.3 210.0 212.7 210.0 217.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 2 to 3</title><path d="M 210.0 270.0 C 210.0 274.3 210.0 278.7 210.0 283.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 3 to 4</title><path d="M 210.0 336.0 C 210.0 340.3 210.0 344.7 210.0 349.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 4 to 5</title><path d="M 210.0 402.0 C 210.0 406.3 210.0 410.7 210.0 415.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 5 to 6</title><path d="M 210.0 468.0 C 210.0 472.3 210.0 476.7 210.0 481.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 6 to 7</title><path d="M 210.0 534.0 C 210.0 538.3 210.0 542.7 210.0 547.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 7 to 8</title><path d="M 210.0 600.0 C 210.0 604.3 210.0 608.7 210.0 613.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 8 to 9</title><path d="M 210.0 666.0 C 210.0 670.3 210.0 674.7 210.0 679.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 9 to 10</title><path d="M 210.0 732.0 C 210.0 736.3 210.0 740.7 210.0 745.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 10 to 11</title><path d="M 210.0 798.0 C 210.0 802.3 210.0 806.7 210.0 811.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g></svg>