 shelf</title><rect x="28.0" y="196.0" width="364.0" height="34" rx="6" fill="#ffffff" stroke="#dddbda"/><text x="38.0" y="217.5" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Rows</text><g class="cluster"><title>SUM(Quantity) pill</title><rect x="104.0" y="202.0" width="121.8" height="22" rx="11" fill="#59a14f"/><text x="115.0" y="217.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">SUM(Quantity)</text></g><text x="382.0" y="217.5" font-size="11" font-weight="400" fill="#444b53" text-anchor="end">down</text></g><g class="cluster"><title>View</title><rect x="28.0" y="240.0" width="364.0" height="200.0" rx="6" fill="#ffffff" stroke="#dddbda"/><text x="38.0" y="259.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">View</text><text x="382.0" y="259.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="end">one mark per store</text><path d="M 44 410 L 376 410" stroke="#8a939c" stroke-width="1"/><rect x="56.5" y="338.5" width="30.4" height="71.5" fill="#4e79a7"/><text x="71.7" y="426.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="middle">ST-003</text><rect x="111.8" y="306.0" width="30.4" height="104.0" fill="#4e79a7"/><text x="127.0" y="426.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="middle">ST-007</text><rect x="167.1" y="286.5" width="30.4" height="123.5" fill="#4e79a7"/><text x="182.3" y="426.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="middle">ST-011</text><rect x="222.4" y="332.0" width="30.4" height="78.0" fill="#4e79a7"/><text x="237.7" y="426.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="middle">ST-014</text><rect x="277.8" y="358.0" width="30.4" height="52.0" fill="#4e79a7"/><text x="293.0" y="426.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="middle">ST-019</text><rect x="333.1" y="319.0" width="30.4" height="91.0" fill="#4e79a7"/><text x="348.3" y="426.0" font-size="11" font-weight="400" fill="#4