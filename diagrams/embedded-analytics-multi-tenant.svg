<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="662" viewBox="0 0 1200 662" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="How does each supplier see only their own data?"><title>How does each supplier see only their own data?</title><defs><marker id="ah-0176d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0176d3"/></marker><marker id="ah-032d60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#032d60"/></marker><marker id="ah-444b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444b53"/></marker><marker id="ah-59a14f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59a14f"/></marker><marker id="ah-8a939c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a939c"/></marker><marker id="ah-e15759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="661" rx="12" fill="#ffffff" stroke="#dddbda"/><text x="32.0" y="46.0" font-size="22" font-weight="800" fill="#181818" text-anchor="start">How does each supplier see only their own data?</text><text x="32.0" y="70.0" font-size="12" font-weight="400" fill="#444b53" text-anchor="start">Harbour&#x27;s supplier portal on Tableau Cloud: the portal signs the tenant into a token, the workbook filters on it</text><g class="cluster"><title>Supplier portal (your app)</title><rect x="24" y="136" width="372" height="432" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="46" cy="158" r="11" fill="#032d60"/><text x="46.0" y="162.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="64.0" y="163.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Supplier portal (your app)</text><g class="cluster"><title>Supplier signs in</title><rect x="36" y="188" width="348" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="200.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="210.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Supplier signs in</text><text x="80.0" y="225.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">to the portal</text></g><g class="cluster"><title>Portal looks up supplier_id</title><rect x="36" y="269" width="348" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="281.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="291.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Portal looks up supplier_id</text><text x="80.0" y="306.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">from the entitlement table</text></g><g class="cluster"><title>Portal mints a JWT, valid 5 min</title><rect x="36" y="350" width="348" height="107" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="390.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="372.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Portal mints a JWT, valid 5 min</text><text x="80.0" y="387.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">sub = portal user email</text><text x="80.0" y="401.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">scp = tableau:views:embed</text><text x="80.0" y="415.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">https://tableau.com/oda</text><text x="80.0" y="429.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">https://tableau.com/groups</text><text x="80.0" y="443.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">supplier_id = [&quot;S-042&quot;]</text></g><g class="cluster"><title>Renders &lt;tableau-viz token&gt;</title><rect x="36" y="487" width="348" height="65" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="506.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="516.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Renders &lt;tableau-viz token&gt;</text><text x="80.0" y="531.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">supplier sees S-042 only</text></g></g><g class="cluster"><title>Connected app</title><rect x="412" y="136" width="330" height="432" rx="12" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><circle cx="434" cy="158" r="11" fill="#0176d3"/><text x="434.0" y="162.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="452.0" y="163.5" font-size="15" font-weight="700" fill="#0176d3" text-anchor="start">Connected app</text><g class="cluster"><title>Group: suppliers</title><rect x="424" y="269" width="306" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="434" y="281.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="468.0" y="291.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Group: suppliers</text><text x="468.0" y="306.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">on-demand access</text></g><g class="cluster"><title>supplier-portal-prod</title><rect x="424" y="350" width="306" height="107" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="434" y="390.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="468.0" y="393.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">supplier-portal-prod</text><text x="468.0" y="408.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">applies to project: Supplier Portal</text><text x="468.0" y="422.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">domain allowlist: portal domain only</text></g></g><g class="cluster"><title>Content</title><rect x="758" y="136" width="370" height="432" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="780" cy="158" r="11" fill="#032d60"/><text x="780.0" y="162.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="798.0" y="163.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Content</text><g class="cluster"><title>Project: Supplier S-007</title><rect x="770" y="188" width="346" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="780" y="200.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="814.0" y="210.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Project: Supplier S-007</text><text x="814.0" y="225.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">bespoke, own group</text></g><g class="cluster"><title>Project: Supplier Portal (locked)</title><rect x="770" y="350" width="346" height="107" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="780" y="390.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="814.0" y="400.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Project: Supplier Portal (locked)</text><text x="814.0" y="415.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Workbook: Sell-through</text></g><g class="cluster"><title>Filter in the workbook data source</title><rect x="770" y="487" width="346" height="65" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="780" y="506.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="814.0" y="509.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Filter in the workbook data source</text><text x="814.0" y="524.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">USERATTRIBUTEINCLUDES(&#x27;supplier_id&#x27;,</text><text x="814.0" y="538.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">[supplier_id])</text></g></g><g class="cluster"><title>Tableau Cloud site &quot;harbour-embedded&quot;</title><rect x="404" y="106" width="732" height="470" rx="14" fill="none" stroke="#0176d3" stroke-width="1.3" stroke-dasharray="6 5"/><text x="1122.0" y="123.0" font-size="11" font-weight="700" fill="#0176d3" text-anchor="end">Tableau Cloud site &quot;harbour-embedded&quot;</text></g><g class="edge"><title>sign in</title><path d="M 210.0 239.0 C 210.0 248.0 210.0 257.0 210.0 266.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>look up</title><path d="M 210.0 320.0 C 210.0 329.0 210.0 338.0 210.0 347.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>JWT</title><path d="M 384.0 403.5 C 396.3 403.5 408.7 403.5 421.0 403.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>on-demand group</title><path d="M 577.0 350.0 C 577.0 341.0 577.0 332.0 577.0 323.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>open the view</title><path d="M 730.0 403.5 C 742.3 403.5 754.7 403.5 767.0 403.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>filter by supplier</title><path d="M 943.0 457.0 C 943.0 466.0 943.0 475.0 943.0 484.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>viz back</title><path d="M 770.0 519.5 C 642.3 519.5 514.7 519.5 387.0 519.5" fill="none" stroke="#59a14f" stroke-width="1.6" marker-end="url(#ah-59a14f)"/><text x="578.5" y="512.5" font-size="11" font-weight="600" fill="#59a14f" text-anchor="middle">viz</text></g><g class="cluster"><title>legend</title><rect x="24" y="598" width="1152" height="44" rx="10" fill="#f6f7f8" stroke="#dddbda"/><path d="M 40 620.0 L 70 620.0" stroke="#0176d3" stroke-width="1.8" marker-end="url(#ah-0176d3)" fill="none"/><text x="78.0" y="624.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">sign-in with tenant claims</text><path d="M 252.72 620.0 L 282.72 620.0" stroke="#59a14f" stroke-width="1.8" marker-end="url(#ah-59a14f)" fill="none"/><text x="290.7" y="624.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">filtered viz back to the portal</text><rect x="494.04" y="612.0" width="22" height="16" rx="4" fill="none" stroke="#0176d3" stroke-width="1.3" stroke-dasharray="4 3"/><text x="524.0" y="624.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">one site per environment</text><text x="1160.0" y="624.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="end">Tenant comes from your app, never the browser</text></g></svg>