<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="604" viewBox="0 0 1200 604" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Where does each part of a worksheet live?"><title>Where does each part of a worksheet live?</title><rect x="0.5" y="0.5" width="1199" height="603" rx="12" fill="#ffffff" stroke="#dddbda"/><text x="32.0" y="46.0" font-size="22" font-weight="800" fill="#181818" text-anchor="start">Where does each part of a worksheet live?</text><text x="32.0" y="70.0" font-size="12" font-weight="400" fill="#444b53" text-anchor="start">Columns and Rows set the structure, the Marks card sets how each mark looks, Filters decide which rows take part</text><g class="cluster"><title>Tableau Desktop worksheet</title><rect x="24" y="96" width="1152" height="420" rx="10" fill="#fbfbfc" stroke="#dddbda"/><image x="36" y="105" width="22" height="22" href="data:image/svg+xml;base64,"/><text x="66.0" y="121.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Desktop worksheet</text><g class="cluster"><title>Show Me</title><rect x="1072" y="103" width="92" height="26" rx="5" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><text x="1118.0" y="121.0" font-size="12" font-weight="700" fill="#0176d3" text-anchor="middle">Show Me</text></g><text x="1060.0" y="121.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="end">ready-made chart types for what is in the view</text><g class="cluster"><title>Data</title><rect x="36.0" y="140.0" width="196.0" height="362.0" rx="6" fill="#f6f7f8" stroke="#dddbda"/><text x="46.0" y="159.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Data</text><text x="46.0" y="180.0" font-size="11" font-weight="600" fill="#0176d3" text-anchor="start">harbour-goods-orders</text><rect x="48" y="197" width="9" height="9" rx="2" fill="#4e79a7"/><text x="64.0" y="206.0" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Store Id</text><rect x="48" y="221" width="9" height="9" rx="2" fill="#4e79a7"/><text x="64.0" y="230.0" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Product Id</text><rect x="48" y="245" width="9" height="9" rx="2" fill="#59a14f"/><text x="64.0" y="254.0" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Discount</text><rect x="48" y="269" width="9" height="9" rx="2" fill="#59a14f"/><text x="64.0" y="278.0" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Quantity</text><text x="46.0" y="488.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">fields to drag</text></g><g class="cluster"><title>Pages</title><rect x="244.0" y="140.0" width="214.0" height="56.0" rx="6" fill="#ffffff" stroke="#dddbda"/><text x="254.0" y="159.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Pages</text><text x="254.0" y="180.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">one view per value</text></g><g class="cluster"><title>Filters</title><rect x="244.0" y="206.0" width="214.0" height="90.0" rx="6" fill="#ffffff" stroke="#dddbda"/><text x="254.0" y="225.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Filters</text><g class="cluster"><title>Discount pill</title><rect x="254.0" y="236.0" width="83.4" height="22" rx="11" fill="#59a14f"/><text x="265.0" y="251.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">Discount</text></g><text x="254.0" y="282.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">which rows take part</text></g><g class="cluster"><title>Marks</title><rect x="244.0" y="306.0" width="214.0" height="196.0" rx="6" fill="#ffffff" stroke="#dddbda"/><text x="254.0" y="325.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Marks</text><rect x="254" y="336" width="194" height="26" rx="4" fill="#f6f7f8" stroke="#dddbda"/><text x="264.0" y="353.0" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Automatic</text><path d="M 428 346 L 438 346 L 433 352 Z" fill="#444b53"/><g class="cluster"><title>Color button</title><rect x="254.0" y="372" width="60.7" height="38" rx="4" fill="#ffffff" stroke="#dddbda"/><text x="284.3" y="396.0" font-size="11" font-weight="400" fill="#181818" text-anchor="middle">Color</text></g><g class="cluster"><title>Size button</title><rect x="320.7" y="372" width="60.7" height="38" rx="4" fill="#ffffff" stroke="#dddbda"/><text x="351.0" y="396.0" font-size="11" font-weight="400" fill="#181818" text-anchor="middle">Size</text></g><g class="cluster"><title>Label button</title><rect x="387.3" y="372" width="60.7" height="38" rx="4" fill="#ffffff" stroke="#dddbda"/><text x="417.7" y="396.0" font-size="11" font-weight="400" fill="#181818" text-anchor="middle">Label</text></g><g class="cluster"><title>Detail button</title><rect x="254.0" y="418" width="60.7" height="38" rx="4" fill="#ffffff" stroke="#dddbda"/><text x="284.3" y="442.0" font-size="11" font-weight="400" fill="#181818" text-anchor="middle">Detail</text></g><g class="cluster"><title>Tooltip button</title><rect x="320.7" y="418" width="60.7" height="38" rx="4" fill="#ffffff" stroke="#dddbda"/><text x="351.0" y="442.0" font-size="11" font-weight="400" fill="#181818" text-anchor="middle">Tooltip</text></g><text x="254.0" y="488.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">how each mark looks</text></g><g class="cluster"><title>Columns shelf</title><rect x="470.0" y="140.0" width="694.0" height="34" rx="6" fill="#ffffff" stroke="#dddbda"/><text x="480.0" y="161.5" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Columns</text><g class="cluster"><title>Store Id pill</title><rect x="546.0" y="146.0" width="83.4" height="22" rx="11" fill="#4e79a7"/><text x="557.0" y="161.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">Store Id</text></g><text x="1154.0" y="161.5" font-size="11" font-weight="400" fill="#444b53" text-anchor="end">what goes across</text></g><g class="cluster"><title>Rows shelf</title><rect x="470.0" y="184.0" width="694.0" height="34" rx="6" fill="#ffffff" stroke="#dddbda"/><text x="480.0" y="205.5" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Rows</text><g class="cluster"><title>SUM(Quantity) pill</title><rect x="546.0" y="190.0" width="121.8" height="22" rx="11" fill="#59a14f"/><text x="557.0" y="205.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">SUM(Quantity)</text></g><text x="1154.0" y="205.5" font-size="11" font-weight="400" fill="#444b53" text-anchor="end">what goes down</text></g><g class="cluster"><title>View</title><rect x="470.0" y="228.0" width="694.0" height="274.0" rx="6" fill="#ffffff" stroke="#dddbda"/><text x="480.0" y="247.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">View</text><text x="1154.0" y="247.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="end">one mark per store</text><path d="M 486 472 L 1148 472" stroke="#8a939c" stroke-width="1"/><rect x="518.2" y="359.8" width="46.0" height="112.2" fill="#4e79a7"/><text x="541.2" y="488.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="middle">ST-003</text><rect x="628.5" y="308.8" width="46.0" height="163.2" fill="#4e79a7"/><text x="651.5" y="488.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="middle">ST-007</text><rect x="738.8" y="278.2" width="46.0" height="193.8" fill="#4e79a7"/><text x="761.8" y="488.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="middle">ST-011</text><rect x="849.2" y="349.6" width="46.0" height="122.4" fill="#4e79a7"/><text x="872.2" y="488.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="middle">ST-014</text><rect x="959.5" y="390.4" width="46.0" height="81.6" fill="#4e79a7"/><text x="982.5" y="488.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="middle">ST-019</text><rect x="1069.8" y="329.2" width="46.0" height="142.8" fill="#4e79a7"/><text x="1092.8" y="488.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="middle">ST-022</text></g></g><g class="cluster"><title>legend</title><rect x="24" y="540" width="1152" height="44" rx="10" fill="#f6f7f8" stroke="#dddbda"/><rect x="40" y="554.0" width="22" height="16" rx="4" fill="#4e79a7" stroke="#4e79a7" stroke-width="1.5"/><text x="70.0" y="566.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">blue pill: discrete, splits the view</text><rect x="301.92" y="554.0" width="22" height="16" rx="4" fill="#59a14f" stroke="#59a14f" stroke-width="1.5"/><text x="331.9" y="566.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">green pill: continuous, draws an axis</text><rect x="569.5600000000001" y="554.0" width="22" height="16" rx="4" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><text x="599.6" y="566.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">Show Me only moves pills</text></g></svg>