<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="586" viewBox="0 0 1200 586" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="In what order does Tableau apply filters and calculations?"><title>In what order does Tableau apply filters and calculations?</title><defs><marker id="ah-0176d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0176d3"/></marker><marker id="ah-032d60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#032d60"/></marker><marker id="ah-444b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444b53"/></marker><marker id="ah-59a14f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59a14f"/></marker><marker id="ah-8a939c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a939c"/></marker><marker id="ah-e15759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="585" rx="12" fill="#ffffff" stroke="#dddbda"/><text x="32.0" y="46.0" font-size="22" font-weight="800" fill="#181818" text-anchor="start">In what order does Tableau apply filters and calculations?</text><text x="32.0" y="70.0" font-size="12" font-weight="400" fill="#444b53" text-anchor="start">Not the order you dragged the pills: a fixed pipeline from data source to view</text><g class="cluster"><title>Data source</title><rect x="24" y="104" width="548" height="50" rx="8" fill="#f6f7f8" stroke="#dddbda" stroke-width="1"/><image x="36" y="116" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="126.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Data source</text><text x="72.0" y="141.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">where every query starts</text></g><g class="cluster"><title>Extract filters</title><rect x="24" y="172" width="548" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="49" cy="197" r="12" fill="#032d60"/><text x="49.0" y="201.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="72.0" y="194.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Extract filters</text><text x="72.0" y="209.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">applied when the extract is built</text></g><g class="cluster"><title>Data source filters</title><rect x="24" y="240" width="548" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="49" cy="265" r="12" fill="#032d60"/><text x="49.0" y="269.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="72.0" y="262.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Data source filters</text><text x="72.0" y="277.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">every sheet that uses the source</text></g><g class="cluster"><title>Context filters</title><rect x="24" y="308" width="548" height="50" rx="8" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><circle cx="49" cy="333" r="12" fill="#0176d3"/><text x="49.0" y="337.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="72.0" y="330.0" font-size="12" font-weight="700" fill="#0176d3" text-anchor="start">Context filters</text><text x="72.0" y="345.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">grey pills, right-click, Add to Context</text></g><g class="cluster"><title>Sets, conditional and Top N filters</title><rect x="24" y="376" width="548" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="49" cy="401" r="12" fill="#032d60"/><text x="49.0" y="405.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="72.0" y="398.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Sets, conditional and Top N filters</text><text x="72.0" y="413.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">with FIXED level of detail expressions</text></g><g class="cluster"><title>Dimension filters</title><rect x="24" y="444" width="548" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="49" cy="469" r="12" fill="#032d60"/><text x="49.0" y="473.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="72.0" y="466.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Dimension filters</text><text x="72.0" y="481.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">blue pills on Filters</text></g><g class="cluster"><title>Data blending</title><rect x="628" y="104" width="548" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="653" cy="129" r="12" fill="#032d60"/><text x="653.0" y="133.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="676.0" y="126.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Data blending</text><text x="676.0" y="141.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">with INCLUDE and EXCLUDE level of detail expressions</text></g><g class="cluster"><title>Measure filters</title><rect x="628" y="172" width="548" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="653" cy="197" r="12" fill="#032d60"/><text x="653.0" y="201.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">7</text><text x="676.0" y="194.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Measure filters</text><text x="676.0" y="209.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">green pills on Filters</text></g><g class="cluster"><title>Totals, forecasts, table calculations</title><rect x="628" y="240" width="548" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="653" cy="265" r="12" fill="#032d60"/><text x="653.0" y="269.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">8</text><text x="676.0" y="262.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Totals, forecasts, table calculations</text><text x="676.0" y="277.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">computed on what is left</text></g><g class="cluster"><title>Table calculation filters</title><rect x="628" y="308" width="548" height="50" rx="8" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><circle cx="653" cy="333" r="12" fill="#0176d3"/><text x="653.0" y="337.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">9</text><text x="676.0" y="330.0" font-size="12" font-weight="700" fill="#0176d3" text-anchor="start">Table calculation filters</text><text x="676.0" y="345.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">a filter on a table calc field</text></g><g class="cluster"><title>Trend lines and reference lines</title><rect x="628" y="376" width="548" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1"/><circle cx="653" cy="401" r="12" fill="#032d60"/><text x="653.0" y="405.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">10</text><text x="676.0" y="398.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Trend lines and reference lines</text><text x="676.0" y="413.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">drawn last</text></g><g class="cluster"><title>View</title><rect x="628" y="444" width="548" height="50" rx="8" fill="#f6f7f8" stroke="#dddbda" stroke-width="1"/><image x="640" y="456" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="676.0" y="466.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">View</text><text x="676.0" y="481.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">what the reader sees</text></g><g class="edge"><title>step 0 to 1</title><path d="M 298.0 154.0 C 298.0 159.0 298.0 164.0 298.0 169.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 1 to 2</title><path d="M 298.0 222.0 C 298.0 227.0 298.0 232.0 298.0 237.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 2 to 3</title><path d="M 298.0 290.0 C 298.0 295.0 298.0 300.0 298.0 305.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 3 to 4</title><path d="M 298.0 358.0 C 298.0 363.0 298.0 368.0 298.0 373.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 4 to 5</title><path d="M 298.0 426.0 C 298.0 431.0 298.0 436.0 298.0 441.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 5 to 6</title><path d="M 572.0 469.0 C 581.3 469.0 590.7 469.0 600.0 469.0 C 600.0 355.7 600.0 242.3 600.0 129.0 C 608.3 129.0 616.7 129.0 625.0 129.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 6 to 7</title><path d="M 902.0 154.0 C 902.0 159.0 902.0 164.0 902.0 169.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 7 to 8</title><path d="M 902.0 222.0 C 902.0 227.0 902.0 232.0 902.0 237.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 8 to 9</title><path d="M 902.0 290.0 C 902.0 295.0 902.0 300.0 902.0 305.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 9 to 10</title><path d="M 902.0 358.0 C 902.0 363.0 902.0 368.0 902.0 373.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>step 10 to 11</title><path d="M 902.0 426.0 C 902.0 431.0 902.0 436.0 902.0 441.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>legend</title><rect x="24" y="522" width="1152" height="44" rx="10" fill="#f6f7f8" stroke="#dddbda"/><path d="M 40 544.0 L 70 544.0" stroke="#0176d3" stroke-width="1.8" marker-end="url(#ah-0176d3)" fill="none"/><text x="78.0" y="548.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">next step works on what this one left</text><rect x="315.64" y="536.0" width="22" height="16" rx="4" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><text x="345.6" y="548.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">the two everyday ways to move a filter</text><text x="1160.0" y="548.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="end">Add to Context moves a filter up, a table calc filter moves it to the end</text></g></svg>