oud or Server</title><rect x="914" y="354" width="250" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="924" y="366.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="958.0" y="376.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Cloud or Server</text><text x="958.0" y="391.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">workbooks on the web read it too</text></g></g><g class="cluster"><title>Tableau Prep Builder flow</title><rect x="302" y="164" width="316" height="241" rx="8" fill="#ffffff" stroke="#dddbda"/><image x="312" y="176" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="348.0" y="189.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Prep Builder flow</text><text x="348.0" y="204.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">the same fixes, run once for everyone</text><g class="cluster"><title>Input step</title><rect x="314.0" y="272.5" width="59.5" height="32" rx="6" fill="#eef4ff" stroke="#0176d3"/><text x="343.8" y="292.5" font-size="12" font-weight="700" fill="#0176d3" text-anchor="middle">Input</text></g><g class="cluster"><title>Clean step</title><rect x="391.5" y="272.5" width="59.5" height="32" rx="6" fill="#eef4ff" stroke="#0176d3"/><text x="421.2" y="292.5" font-size="12" font-weight="700" fill="#0176d3" text-anchor="middle">Clean</text></g><g class="edge"><title>next step</title><path d="M 375.5 288.5 C 379.8 288.5 384.2 288.5 388.5 288.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>Join step</title><rect x="469.0" y="272.5" width="59.5" height="32" rx="6" fill="#eef4ff" stroke="#0176d3"/><text x="498.8" y="292.5" font-size="12" font-weight="700" fill="#0176d3" text-anchor="middle">Join</text></g><g class="edge"><title>next step</title><path d="M 453.0 288.5 C 457.3 288.5 461.7 288.5 466.0 288.5" fill="none" s