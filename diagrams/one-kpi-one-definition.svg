<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Where does Net Sales get its one definition?"><title>Where does Net Sales get its one definition?</title><defs><marker id="ah-0176d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0176d3"/></marker><marker id="ah-032d60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#032d60"/></marker><marker id="ah-444b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444b53"/></marker><marker id="ah-59a14f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59a14f"/></marker><marker id="ah-8a939c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a939c"/></marker><marker id="ah-e15759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="544" rx="12" fill="#ffffff" stroke="#dddbda"/><text x="32.0" y="46.0" font-size="22" font-weight="800" fill="#181818" text-anchor="start">Where does Net Sales get its one definition?</text><text x="32.0" y="70.0" font-size="12" font-weight="400" fill="#444b53" text-anchor="start">Clean once upstream, define once in a certified published data source, then every workbook, Pulse metric and web author reads it</text><g class="cluster"><title>Clean once</title><rect x="24" y="112" width="280" height="337" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="46" cy="134" r="11" fill="#032d60"/><text x="46.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="64.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Clean once</text><g class="cluster"><title>Warehouse or cleaned files</title><rect x="36" y="164" width="256" height="65" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="183.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="186.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Warehouse or cleaned files</text><text x="80.0" y="201.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">orders_clean view: bad rows</text><text x="80.0" y="215.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">excluded once, upstream</text></g></g><g class="cluster"><title>Define once</title><rect x="320" y="112" width="440" height="337" rx="12" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><circle cx="342" cy="134" r="11" fill="#0176d3"/><text x="342.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="360.0" y="139.5" font-size="15" font-weight="700" fill="#0176d3" text-anchor="start">Define once</text><g class="cluster"><title>Harbour Goods Sales</title><rect x="332" y="164" width="416" height="65" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="342" y="183.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="376.0" y="193.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Harbour Goods Sales</text><text x="376.0" y="208.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">published data source, certified, one owner</text></g><g class="cluster"><title>KPI fields</title><rect x="332" y="259" width="416" height="93" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="342" y="292.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="376.0" y="281.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">KPI fields</text><text x="376.0" y="296.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Net Sales = SUM(quantity * unit_price * (1-discount))</text><text x="376.0" y="310.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Gross Sales = SUM(quantity * unit_price)</text><text x="376.0" y="324.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Margin = Net Sales - SUM(quantity * unit_cost)</text><text x="376.0" y="338.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">descriptions on every KPI field</text></g></g><g class="cluster"><title>Read the same field</title><rect x="776" y="112" width="352" height="337" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="798" cy="134" r="11" fill="#032d60"/><text x="798.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="816.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Read the same field</text><g class="cluster"><title>Workbooks</title><rect x="788" y="164" width="328" height="65" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="798" y="183.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="832.0" y="193.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Workbooks</text><text x="832.0" y="208.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">connect, never redefine</text></g><g class="cluster"><title>Tableau Pulse metric definition</title><rect x="788" y="259" width="328" height="93" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="798" y="292.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="832.0" y="288.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Pulse metric definition</text><text x="832.0" y="303.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">measure: Net Sales</text><text x="832.0" y="317.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">time: Order Date</text><text x="832.0" y="331.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">value going up: favourable</text></g><g class="cluster"><title>Ad hoc web authoring</title><rect x="788" y="382" width="328" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="798" y="394.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="832.0" y="404.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Ad hoc web authoring</text><text x="832.0" y="419.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">same fields, no local copies</text></g></g><g class="edge"><title>clean rows</title><path d="M 292.0 196.5 C 304.3 196.5 316.7 196.5 329.0 196.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>fields</title><path d="M 540.0 229.0 C 540.0 238.0 540.0 247.0 540.0 256.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>connect</title><path d="M 748.0 196.5 C 760.3 196.5 772.7 196.5 785.0 196.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>measure</title><path d="M 748.0 305.5 C 760.3 305.5 772.7 305.5 785.0 305.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>same fields</title><path d="M 748.0 305.5 C 759.3 305.5 770.7 305.5 782.0 305.5 C 782.0 339.5 782.0 373.5 782.0 407.5 C 783.0 407.5 784.0 407.5 785.0 407.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>legend</title><rect x="24" y="481" width="1152" height="44" rx="10" fill="#f6f7f8" stroke="#dddbda"/><path d="M 40 503.0 L 70 503.0" stroke="#0176d3" stroke-width="1.8" marker-end="url(#ah-0176d3)" fill="none"/><text x="78.0" y="507.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">reads the one definition</text><rect x="241.28" y="495.0" width="22" height="16" rx="4" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><text x="271.3" y="507.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">where the definition lives</text></g></svg>