ect</text></g></g><g class="edge"><title>next layer</title><path d="M 210.0 889.0 C 210.0 896.0 210.0 903.0 210.0 910.0" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>Consume</title><rect x="16" y="913" width="388" height="116" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="935" r="11" fill="#032d60"/><text x="38.0" y="939.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="56.0" y="940.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Consume</text><g class="cluster"><title>Workbooks and dashboards</title><rect x="28" y="965" width="364" height="50" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="38" y="977.0" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="72.0" y="993.5" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Workbooks and dashboards</text></g></g><g class="cluster"><title>Tableau Catalog</title><rect x="16" y="1059" width="388" height="103" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="38" cy="1081" r="11" fill="#032d60"/><text x="38.0" y="1085.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="56.0" y="1086.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Tableau Catalog</text><text x="30.0" y="1115.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">lineage from warehouse column to dashboard, data quality</text><text x="30.0" y="1130.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">warnings, descriptions on tables and columns, sensitivity</text><text x="30.0" y="1145.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">labels</text></g></svg>