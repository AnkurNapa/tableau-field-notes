<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="764" viewBox="0 0 1200 764" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Which site roles can each licence carry?"><title>Which site roles can each licence carry?</title><defs><marker id="ah-0176d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0176d3"/></marker><marker id="ah-032d60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#032d60"/></marker><marker id="ah-444b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444b53"/></marker><marker id="ah-59a14f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59a14f"/></marker><marker id="ah-8a939c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a939c"/></marker><marker id="ah-e15759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="763" rx="12" fill="#ffffff" stroke="#dddbda"/><text x="32.0" y="46.0" font-size="22" font-weight="800" fill="#181818" text-anchor="start">Which site roles can each licence carry?</text><text x="32.0" y="70.0" font-size="12" font-weight="400" fill="#444b53" text-anchor="start">The licence is the ceiling you pay for. The site role under it is what Tableau checks, and it decides who can publish</text><g class="cluster"><title>Licence you pay for</title><rect x="24" y="112" width="300" height="560" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="46" cy="134" r="11" fill="#032d60"/><text x="46.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="64.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Licence you pay for</text><g class="cluster"><title>Creator</title><rect x="36" y="164" width="276" height="177" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="239.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="249.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Creator</text><text x="80.0" y="264.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">connects to new data, builds anything</text></g><g class="cluster"><title>Explorer</title><rect x="36" y="353" width="276" height="177" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="428.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="431.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Explorer</text><text x="80.0" y="446.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">builds from data that is already</text><text x="80.0" y="460.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">published</text></g><g class="cluster"><title>Viewer</title><rect x="36" y="542" width="276" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="554.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="564.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Viewer</text><text x="80.0" y="579.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">looks, filters and subscribes</text></g><g class="cluster"><title>No licence</title><rect x="36" y="605" width="276" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="617.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="634.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">No licence</text></g></g><g class="cluster"><title>Site role you assign</title><rect x="340" y="112" width="450" height="560" rx="12" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><circle cx="362" cy="134" r="11" fill="#0176d3"/><text x="362.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="380.0" y="139.5" font-size="15" font-weight="700" fill="#0176d3" text-anchor="start">Site role you assign</text><g class="cluster"><title>Server Administrator</title><rect x="352" y="164" width="426" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><text x="364.0" y="186.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Server Administrator</text><text x="364.0" y="201.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Tableau Server only, across every site</text></g><g class="cluster"><title>Site Administrator Creator</title><rect x="352" y="227" width="426" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><text x="364.0" y="249.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Site Administrator Creator</text><text x="364.0" y="264.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">top admin role on Tableau Cloud, per site</text></g><g class="cluster"><title>Creator</title><rect x="352" y="290" width="426" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><text x="364.0" y="312.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Creator</text><text x="364.0" y="327.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">builds and publishes anything</text></g><g class="cluster"><title>Site Administrator Explorer</title><rect x="352" y="353" width="426" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><text x="364.0" y="375.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Site Administrator Explorer</text><text x="364.0" y="390.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">administers a site on an Explorer licence</text></g><g class="cluster"><title>Explorer (can publish)</title><rect x="352" y="416" width="426" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><text x="364.0" y="438.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Explorer (can publish)</text><text x="364.0" y="453.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">publishes on existing data sources</text></g><g class="cluster"><title>Explorer</title><rect x="352" y="479" width="426" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><text x="364.0" y="501.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Explorer</text><text x="364.0" y="516.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">builds from published data, does not publish</text></g><g class="cluster"><title>Viewer</title><rect x="352" y="542" width="426" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><text x="364.0" y="564.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Viewer</text><text x="364.0" y="579.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">the only role a Viewer licence carries</text></g><g class="cluster"><title>Unlicensed</title><rect x="352" y="605" width="426" height="51" rx="8" fill="#ffffff" stroke="#e15759" stroke-width="1.5"/><text x="364.0" y="627.0" font-size="12" font-weight="700" fill="#e15759" text-anchor="start">Unlicensed</text><text x="364.0" y="642.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">the account stays, sign-in does not</text></g></g><g class="cluster"><title>Can publish?</title><rect x="806" y="112" width="370" height="560" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="828" cy="134" r="11" fill="#032d60"/><text x="828.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="846.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Can publish?</text><g class="cluster"><title>Full</title><rect x="818" y="164" width="346" height="177" rx="8" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><text x="830.0" y="249.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Full</text><text x="830.0" y="264.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">workbooks and new data sources</text></g><g class="cluster"><title>Limited</title><rect x="818" y="353" width="346" height="114" rx="8" fill="#f1f8ef" stroke="#59a14f" stroke-width="1.5"/><text x="830.0" y="399.5" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Limited</text><text x="830.0" y="414.5" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">workbooks on data sources that already exist</text><text x="830.0" y="428.5" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">cannot connect to new data</text></g><g class="cluster"><title>No</title><rect x="818" y="479" width="346" height="114" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><text x="830.0" y="532.5" font-size="12" font-weight="700" fill="#181818" text-anchor="start">No</text><text x="830.0" y="547.5" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">view and interact only</text></g><g class="cluster"><title>Cannot sign in</title><rect x="818" y="605" width="346" height="51" rx="8" fill="#ffffff" stroke="#e15759" stroke-width="1.5"/><text x="830.0" y="634.0" font-size="12" font-weight="700" fill="#e15759" text-anchor="start">Cannot sign in</text></g></g><g class="edge"><title>cre to sa</title><path d="M 312.0 189.5 C 324.3 189.5 336.7 189.5 349.0 189.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>cre to sac</title><path d="M 312.0 252.5 C 324.3 252.5 336.7 252.5 349.0 252.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>cre to rc</title><path d="M 312.0 315.5 C 324.3 315.5 336.7 315.5 349.0 315.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>exp to sae</title><path d="M 312.0 378.5 C 324.3 378.5 336.7 378.5 349.0 378.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>exp to rep</title><path d="M 312.0 441.5 C 324.3 441.5 336.7 441.5 349.0 441.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>exp to re</title><path d="M 312.0 504.5 C 324.3 504.5 336.7 504.5 349.0 504.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>vie to rv</title><path d="M 312.0 567.5 C 324.3 567.5 336.7 567.5 349.0 567.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>non to ru</title><path d="M 312.0 630.5 C 324.3 630.5 336.7 630.5 349.0 630.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>legend</title><rect x="24" y="700" width="1152" height="44" rx="10" fill="#f6f7f8" stroke="#dddbda"/><path d="M 40 722.0 L 70 722.0" stroke="#0176d3" stroke-width="1.8" marker-end="url(#ah-0176d3)" fill="none"/><text x="78.0" y="726.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">licence carries this role</text><rect x="247.0" y="714.0" width="22" height="16" rx="4" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><text x="277.0" y="726.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">full publishing</text><rect x="388.8" y="714.0" width="22" height="16" rx="4" fill="#f1f8ef" stroke="#59a14f" stroke-width="1.5"/><text x="418.8" y="726.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">limited</text><rect x="484.84000000000003" y="714.0" width="22" height="16" rx="4" fill="#ffffff" stroke="#e15759" stroke-width="1.5"/><text x="514.8" y="726.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">no access</text><text x="1160.0" y="726.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="end">Same three licences on Server and Cloud</text></g></svg>