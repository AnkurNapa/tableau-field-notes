<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="How does content move from Tableau Server to Tableau Cloud?"><title>How does content move from Tableau Server to Tableau Cloud?</title><defs><marker id="ah-0176d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0176d3"/></marker><marker id="ah-032d60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#032d60"/></marker><marker id="ah-444b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444b53"/></marker><marker id="ah-59a14f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59a14f"/></marker><marker id="ah-8a939c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a939c"/></marker><marker id="ah-e15759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="554" rx="12" fill="#ffffff" stroke="#dddbda"/><text x="32.0" y="46.0" font-size="22" font-weight="800" fill="#181818" text-anchor="start">How does content move from Tableau Server to Tableau Cloud?</text><text x="32.0" y="70.0" font-size="12" font-weight="400" fill="#444b53" text-anchor="start">Inventory and clean on Server, move with the Migration SDK, land on a prepared Cloud site, then retire Server</text><g class="cluster"><title>Source</title><rect x="24" y="112" width="356" height="281" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="46" cy="134" r="11" fill="#032d60"/><text x="46.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="64.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Source</text><g class="cluster"><title>Tableau Server</title><rect x="36" y="164" width="332" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="176.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="186.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Server</text><text x="80.0" y="201.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">content after cleanup</text></g><g class="cluster"><title>Repository</title><rect x="36" y="245" width="332" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="46" y="257.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="80.0" y="267.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Repository</text><text x="80.0" y="282.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">inventory queries: owner, size, last view</text></g></g><g class="cluster"><title>Migrate</title><rect x="396" y="112" width="380" height="281" rx="12" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><circle cx="418" cy="134" r="11" fill="#0176d3"/><text x="418.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="436.0" y="139.5" font-size="15" font-weight="700" fill="#0176d3" text-anchor="start">Migrate</text><g class="cluster"><title>Tableau Migration SDK</title><rect x="408" y="164" width="356" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="418" y="176.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="452.0" y="186.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Migration SDK</text><text x="452.0" y="201.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">runs on a machine that can reach both REST APIs</text></g><g class="cluster"><title>Hooks</title><rect x="408" y="245" width="356" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="418" y="257.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="452.0" y="267.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Hooks</text><text x="452.0" y="282.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">map users, rename projects, filter content</text></g></g><g class="cluster"><title>Destination</title><rect x="792" y="112" width="384" height="281" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="814" cy="134" r="11" fill="#032d60"/><text x="814.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="832.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Destination</text><g class="cluster"><title>Tableau Cloud site</title><rect x="804" y="164" width="360" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="814" y="176.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="848.0" y="186.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Cloud site</text><text x="848.0" y="201.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">SSO and SCIM</text></g><g class="cluster"><title>Groups and projects</title><rect x="804" y="245" width="360" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="814" y="257.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="848.0" y="267.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Groups and projects</text><text x="848.0" y="282.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">groups pre-created, projects locked</text></g><g class="cluster"><title>Tableau Bridge</title><rect x="804" y="326" width="360" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="814" y="338.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="848.0" y="348.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Bridge</text><text x="848.0" y="363.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">pools for on-premises sources</text></g></g><g class="edge"><title>content to the SDK</title><path d="M 368.0 189.5 C 380.3 189.5 392.7 189.5 405.0 189.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>SDK to the Cloud site</title><path d="M 764.0 189.5 C 776.3 189.5 788.7 189.5 801.0 189.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>After cutover</title><rect x="24" y="417" width="1152" height="50" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="46" cy="439" r="11" fill="#032d60"/><text x="46.0" y="443.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="64.0" y="444.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">After cutover</text><text x="188.8" y="443.0" font-size="11" font-weight="600" fill="#181818" text-anchor="start">Tableau Server goes read only, then off</text></g><g class="cluster"><title>legend</title><rect x="24" y="491" width="1152" height="44" rx="10" fill="#f6f7f8" stroke="#dddbda"/><path d="M 40 513.0 L 70 513.0" stroke="#0176d3" stroke-width="1.8" marker-end="url(#ah-0176d3)" fill="none"/><text x="78.0" y="517.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">content moves</text><rect x="178.36" y="505.0" width="22" height="16" rx="4" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/><text x="208.4" y="517.0" font-size="11" font-weight="400" fill="#181818" text-anchor="start">the migration tool</text></g></svg>