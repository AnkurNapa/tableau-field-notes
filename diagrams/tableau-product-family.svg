#181818" text-anchor="start">Tableau Server</text><text x="426.0" y="201.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">you install and run it</text></g><g class="cluster"><title>Tableau Cloud</title><rect x="382" y="245" width="356" height="65" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="392" y="264.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="426.0" y="274.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Cloud</text><text x="426.0" y="289.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">Salesforce hosts it</text></g><g class="cluster"><title>Tableau Public</title><rect x="382" y="340" width="356" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="392" y="352.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="426.0" y="362.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Public</text><text x="426.0" y="377.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">free website: everything published is public</text></g></g><g class="cluster"><title>Watch</title><rect x="766" y="112" width="410" height="295" rx="12" fill="#fbfbfc" stroke="#dddbda" stroke-width="1"/><circle cx="788" cy="134" r="11" fill="#032d60"/><text x="788.0" y="138.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="806.0" y="139.5" font-size="15" font-weight="700" fill="#181818" text-anchor="start">Watch</text><g class="cluster"><title>Tableau Pulse</title><rect x="778" y="245" width="386" height="65" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="788" y="264.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="822.0" y="274.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Pulse</text><text x="822.0" y="289.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">metrics that send a digest by email, Slack or Teams</text></g><g class="cluster"><title>Tableau Next</title><rect x="778" y="340" width="386" height="51" rx="8" fill="#ffffff" stroke="#dddbda" stroke-width="1.0"/><image x="788" y="352.5" width="26" height="26" href="data:image/svg+xml;base64,"/><text x="822.0" y="362.0" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Tableau Next</text><text x="822.0" y="377.0" font-size="11" font-weight="400" fill="#444b53" text-anchor="start">agent-first analytics on the Salesforce platform</text></g></g><g class="edge"><title>publish a flow output</title><path d="M 342.0 189.5 C 354.3 189.5 366.7 189.5 379.0 189.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>publish to Server</title><path d="M 342.0 277.5 C 353.3 277.5 364.7 277.5 376.0 277.5 C 376.0 251.5 376.0 225.5 376.0 199.5 C 377.0 199.5 378.0 199.5 379.0 199.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>publish to Cloud</title><path d="M 342.0 277.5 C 354.3 277.5 366.7 277.5 379.0 277.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="edge"><title>save to Tableau Public</title><path d="M 189.0 310.0 C 189.0 328.5 189.0 347.0 189.0 365.5 C 252.3 365.5 315.7 365.5 379.0 365.5" fill="none" stroke="#59a14f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-59a14f)"/></g><g class="edge"><title>metrics on published data</title><path d="M 738.0 277.5 C 750.3 277.5 762.7 277.5 775.0 277.5" fill="none" stroke="#0176d3" stroke-width="1.6" marker-end="url(#ah-0176d3)"/></g><g class="cluster"><title>legend</title><rect x="24" y="439" width="1152" height="44" rx="10" fill="#f6f7f8" stroke="#dddbda"/><path d="M 40 461.0 L 70 461.0" stroke="#0176d3" stroke-width="1.8" marker-end="url(#ah-0176d3)" fill="none"/><text x="78.0" y="465.0" font-size="11" font-weight="400" fill="#181818" text-anchor=